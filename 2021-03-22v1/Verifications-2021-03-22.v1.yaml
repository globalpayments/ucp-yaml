    avs_address_result_VERIFICATIONS.payment_method.digital_wallet.avs_address_result:
      type: string
      enum:
        - MATCHED
      description: The result of the AVS address check.
      example: MATCHED
    cvv_result_VERIFICATIONS.payment_method.digital_wallet.cvv_result:
      type: string
      enum:
        - MATCHED
        - NOT_MATCHED
        - NOT_CHECKED
      description: The result of the CVV check.
      example: MATCHED
    first_name_VERIFICATIONS.payer.first_name:
