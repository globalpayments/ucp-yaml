        - NOT_MATCHED
      description: The result of comparing the middle name provided in the request with the middle name on file for the account.
      example: MATCHED
    avs_action_VERIFICATIONS.payment_method.digital_wallet.avs_action:
      type: string
      description: The recommended action to be taken by the merchant based on the AVS response.
