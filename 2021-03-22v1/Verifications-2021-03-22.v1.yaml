      minLength: 1
      maxLength: 50
      example: transaction_processing
    account_id_VERIFICATIONS.account_id:
      type: string
      description: A unique identifier for the merchant account set by Global Payments.
      minLength: 1
      maxLength: 50
      example: TRA_86920f927028745yt34d077d88beb29b
    channel_VERIFICATIONS.channel:
      type: string
      enum:
        - CP
        - CNP
      description: |
        Describes whether the transaction was processed in a face to face(CP) scenario or a Customer Not Present (CNP) scenario.
        * `CP` - A Customer Present transaction is when the payer and the merchant are in direct face to face contact when exchanging payment method information to fulfill a transaction. e.g. in a store and paying at the counter that is attended by a clerk
        * `CNP` - A Customer NOT Present transaction is when the payer and the merchant are not together when exchanging payment method information to fulfill a transaction. e.g. a transaction executed from a merchant's website or over the phone
      example: CP
    currency_VERIFICATIONS.currency:
      type: string
      enum:
        - USD
        - EUR
        - GBP
        - CAD
        - CHF
        - HKD
        - SGD
        - MOP etc.
      description: The currency of the amount in ISO-4217(alpha-3).
      minLength: 3
      maxLength: 3
      example: USD
    reference_VERIFICATIONS.reference:
      type: string
      description: Merchant defined field to reference the transaction.
      minLength: 8
      maxLength: 50
      example: becf9f3e-4d33-459c-8ed2-0c4affc9555e
    country_VERIFICATIONS.country:
      type: string
      description: The country in ISO-3166-1(alpha-2 code) format.
      example: US
    merchant_identifier_VERIFICATIONS.merchant_identifier:
      type: string
      description: 'The merchant''s reporting identifier, which the merchant uses to track balance inquiry requests in reporting.'
      example: MER_REPORT_001
    mode_VERIFICATIONS.mode:
      type: string
      enum:
        - BALANCE_INQUIRY
      description: Indicates the type of verification to perform. Set to BALANCE_INQUIRY to retrieve the balance of a prepaid card instead of performing a standard account verification.
      example: BALANCE_INQUIRY
    language_VERIFICATIONS.language:
      type: string
      description: Indicates the language the transaction was executed in. In the format ISO-639-1 (alpha-2) or ISO-639-1 (alpha-2)_ISO-3166(alpha-2)
      example: en_CA
    capture_mode_VERIFICATIONS.capture_mode:
      type: string
      enum:
        - AUTO
        - LATER
      description: |-
        "Indicates whether the transaction is to be captured automatically, later or later using more than 1 partial capture.
        * `AUTO` - If a transaction is authorized, funds will exchange between the payer and merchant automatically and as soon as possible.
        * `LATER` - If a transaction is authorized, funds will not exchange between the payer and merchant automatically and will require a subsequent separate action to capture that transaction and start the funding process. Only one successful capture is permitted.
      example: AUTO
    amount_VERIFICATIONS.amount:
      type: number
      description: The amount to transfer between Payer and Merchant for a SALE or a REFUND. It is always represented in the lowest denomination of the related currency. and with no decimal point.
      example: 10000
    user_reference_VERIFICATIONS.user_reference:
      type: string
      description: The merchant's user reference for the transaction. This represents the person who processed the transaction on the merchant's behalf like a clerk or cashier reference.
    authorization_mode_VERIFICATIONS.authorization_mode:
      type: string
      enum:
        - PARTIAL
        - DEFERRED
      description: |
        "Indicates if the transaction can be authorized using another non-standard model where the amount is not fully authorized at the time the transaction is created.
        * `PARTIAL` - Indicates if the transaction can be or was authorized for an amount less than the requested amount. This is available for CP channel. The outstanding balance, not yet authorized, can be processed again using a different card.
        * `DEFERRED` - Indicates if the transaction can be created offline and authorized later when the systems are back online"
      example: PARTIAL
    merchant_category_code_VERIFICATIONS.merchant_category_code:
      type: string
      description: A four-digit number used to classify the merchant into an industry or market segment.
    account_name_inquiry_mode_VERIFICATIONS.account_name_inquiry_mode:
      type: string
      enum:
        - REQUESTED
        - NOT_REQUESTED
      description: Indicates whether an account name inquiry (also known as confirmation of payee) is performed as part of this verification
      example: REQUESTED
    id_VERIFICATIONS.payment_method.id:
      type: string
      description: Unique platform generated id used to reference a stored payment method on the platform. Often referred to as the payment method token. This value can be used instead of payment method details such as a card number and expiry date.
      minLength: 1
      maxLength: 50
      example: PMT_31087d9c-e68c-4389-9f13-39378e166ea5
    first_name_VERIFICATIONS.payment_method.first_name:
      type: string
      description: Specify the first name of the owner of the payment method.
      maxLength: 50
      example: James
    last_name_VERIFICATIONS.payment_method.last_name:
      type: string
      description: Specify the surname of the owner of the payment method.
      maxLength: 50
      example: Mason
    name_VERIFICATIONS.payment_method.name:
      type: string
      description: The name of the payment method
      maxLength: 100
      example: John's payment method
    entry_mode_VERIFICATIONS.payment_method.entry_mode:
      type: string
      enum:
        - MOTO
        - ECOM
        - IN_APP
        - CHIP
        - SWIPE
        - MANUAL
        - CONTACTLESS_CHIP
        - CONTACTLESS_SWIPE
        - PHONE
        - MAIL
      description: |
        Indicates how the payment method information was obtained by the Merchant for this transaction.
        * `MOTO` - A CNP channel entry mode where the payment method information was obtained over the phone or via postal mail.
        * `ECOM` - A CNP channel entry mode where the payment method was obtained via a browser.
        * `IN_APP` - A CNP channel entry mode where the payment method was obtained via an application and applies to digital wallets only.
        * `CHIP` - A CP channel entry mode where the payment method information was obtained from a chip. E.g. card is inserted into a device to read the chip.
        * `SWIPE` - A CP channel entry mode where the payment method information was obtained from swiping a magnetic strip. E.g. card's magnetic strip is swiped through a device to read the card information.
        * `MANUAL` - A CP channel entry mode where the payment method information was obtained by manually keying the payment method information into the device.
        * `CONTACTLESS_CHIP` - A CP channel entry mode where the payment method information was obtained by bringing the payment method to close proximity of a device. E.g. tap a card on or near a device to exchange card information.
        * `CONTACTLESS_SWIPE` - A CP channel entry mode where the payment method information was obtained by bringing the payment method to close proximity of a device and also swiping the card. E.g. tap a card on or near a device and swipe it through device to exchange card information
        * `PHONE` - A CNP channel entry mode where the payment method was obtained over the phone.
        * `MAIL` - A CNP channel entry mode where the payment method was obtained via postal mail.
        * `PRESENT`- The entry mode cannot be determined but it is a Customer Present transaction.
        * `UNKNOWN` - The entry mode for this transaction cannot be determined.
      example: MOTO
    fingerprint_mode_VERIFICATIONS.payment_method.fingerprint_mode:
      type: string
      enum:
        - ALWAYS
        - ON_SUCCESS
      description: |
        Indicates whether to execute the fingerprint signature functionality.
        *`ALWAYS` - Always check and create the fingerprint value regardless of the result of the card authorization.
        *`ON_SUCCESS` - Always check and create the fingerprint value when the card authorization is successful.
      minLength: 1
      maxLength: 50
    storage_mode_VERIFICATIONS.payment_method.storage_mode:
      type: string
      enum:
        - ALWAYS
        - ON_SUCCESS
      description: |
        Indicates whether to store the card as part of a transaction.
        * `ALWAYS` - The card information is always stored irrespective of whether the payment method authorization was successful or not.
        * `ON_SUCCESS` - The card information is only stored if the payment method authorization was successful.
      minLength: 1
      maxLength: 50
      example: ALWAYS
    account_id_VERIFICATIONS.payment_method.account_id:
      type: string
      description: A unique identifier for the merchant account set by Global Payments.
      example: TRA_86920f927028745yt34d077d88beb29b
    method_VERIFICATIONS.payment_method.encryption.method:
      type: string
      enum:
        - KTB
        - KSN
        - RSA_2048_OAEP_SHA_512
      description: |
        Indicates the encryption method used when sending encrypted card data.
        *`KTB` - Indicates Key Transmission Block is being used
        *`KSN` - Indicates Key Serial Number is being used
        *`RSA_2048_OAEP_SHA_512` - Indicates RSA algorithm is being used with OAEP SHA 512 padding.
      minLength: 1
      maxLength: 50
      example: KTB
    version_VERIFICATIONS.payment_method.encryption.version:
      type: string
      description: The version of encryption being used. It is in the form of a two digit value. For example 05 or 06.
      minLength: 1
      maxLength: 50
      example: '06'
    info_VERIFICATIONS.payment_method.encryption.info:
      type: string
      description: |
        The encryption key id info used when sending encrypted data.
        If encryption.method is
        *`KTB` then it is the Key Transmission Block key id value,
        *`KSN` then it is the Key Serial Number key id value,
        *`RSA` then it is the RSA key id value base64 encoded.
      minLength: 1
      maxLength: 2000
    type_VERIFICATIONS.payment_method.encryption.type:
      type: string
      enum:
        - BINARY
        - ASCII
      description: |
        Indicates the encryption encoding format used to encrypt the data.
        *`BINARY` - Indicates data is binary encoded.
        *`ASCII` - Indicates data is encoded as ASCII.
      example: ASCII
    id_VERIFICATIONS.payment_method.authentication.id:
      type: string
      description: A unique identifier that is used to identify and reference an instance of this resource. It is generated by Global Payments to identify the authentication details (3DS data) used with this transaction.
      minLength: 1
      maxLength: 50
      example: AUT_6a061b51-6e7a-4200-9d8c-01be5e26a5bb
    message_version_VERIFICATIONS.payment_method.authentication.three_ds.message_version:
      type: string
      description: Indicates the version of 3D Secure used.
      minLength: 1
      maxLength: 50
    eci_VERIFICATIONS.payment_method.authentication.three_ds.eci:
      type: string
      description: An indication of the degree of the authentication and liability shift obtained for this transaction. It is returned after the 3D Secure process has completed.
      minLength: 1
      maxLength: 5
    value_VERIFICATIONS.payment_method.authentication.three_ds.value:
      type: string
      description: The authentication value created as part of the 3D Secure process.
      minLength: 1
      maxLength: 50
    server_trans_ref_VERIFICATIONS.payment_method.authentication.three_ds.server_trans_ref:
      type: string
      description: The reference created by the 3DSecure provider to identify the specific authentication attempt.
      minLength: 1
      maxLength: 50
    ds_trans_ref_VERIFICATIONS.payment_method.authentication.three_ds.ds_trans_ref:
      type: string
      description: The reference created by the 3DSecure Directory Server to identify the specific authentication attempt.
      minLength: 1
      maxLength: 50
    exempt_status_VERIFICATIONS.payment_method.authentication.three_ds.exempt_status:
      type: string
      enum:
        - LOW_VALUE
        - TRANSACTION_RISK_ANALYSIS
        - TRUSTED_MERCHANT
        - SECURE_CORPORATE_PAYMENT
        - SCA_DELEGATION
      description: Indicates if any exemptions apply to this transaction.
      minLength: 1
      maxLength: 50
      example: LOW_VALUE
    funding_VERIFICATIONS.payment_method.card.funding:
      type: string
      enum:
        - DEBIT
        - CREDIT
        - CASH_BENEFITS
        - FOOD_STAMP
        - PREPAID
      description: |
        Indicates how the card is funded:
        * `DEBIT` - indicates the card is a debit card where the funds may be present in an account to fulfill the transaction amount.
        * `CREDIT` - indicates the card is a credit card where the funds may be available on credit to the payer to fulfill the transaction amount.
        * `FOOD_STAMP` - indicates the card is an, Electronic Benefits Transfer, for food stamps.
        * `CASH_BENEFITS` - indicates the card is an, Electronic Benefits Transfer, for cash benefits.
        * `PREPAID` - indicates the card is a prepaid card where the funds are loaded to the card account to fulfill the transaction amount. Unlike a debit card, a prepaid is not linked to a bank account.
      minLength: 1
      maxLength: 50
      example: CREDIT
    number_VERIFICATIONS.payment_method.card.number:
      type: string
      description: The card account number used to authorize the transaction. Also known as PAN.
      minLength: 1
      maxLength: 50
      example: '4263970000005262'
    expiry_month_VERIFICATIONS.payment_method.card.expiry_month:
      type: string
      description: The 2 digit expiry date month of the card.
      minLength: 2
      maxLength: 2
      example: '05'
    expiry_year_VERIFICATIONS.payment_method.card.expiry_year:
      type: string
      description: The 2 digit expiry date year of the card.
      minLength: 2
      maxLength: 2
      example: '25'
    track_VERIFICATIONS.payment_method.card.track:
      type: string
      description: Data from magnetic stripe of a card
      minLength: 1
      maxLength: 1000
    pin_block_VERIFICATIONS.payment_method.card.pin_block:
      type: string
      description: 'Contains the pin block info, relating to the pin code the Payer entered.'
      minLength: 1
      maxLength: 50
    cvv_VERIFICATIONS.payment_method.card.cvv:
      type: string
      description: The numeric value printed on the physical card.
      minLength: 3
      maxLength: 4
      example: '852'
    cvv_indicator_VERIFICATIONS.payment_method.card.cvv_indicator:
      type: string
      enum:
        - ILLEGIBLE
        - NOT_PRESENT
        - PRESENT
      description: |
        Card Verification Value Indicator sent by the Merchant indicating the CVV availability.
        *`ILLEGIBLE` - indicates the cvv is present but cannot be read.
        *`NOT_PRESENT` - indicates the cvv is not present on the card.
        *`PRESENT` - indicates the cvv is present.
      maxLength: 50
      example: PRESENT
    avs_address_VERIFICATIONS.payment_method.card.avs_address:
      type: string
      description: First line of the address associated with the card.
      maxLength: 50
      example: Apt 123
    avs_postal_code_VERIFICATIONS.payment_method.card.avs_postal_code:
      type: string
      description: Postal code of the address associated with the card.
      maxLength: 50
      example: TGX562
    decryption_required_VERIFICATIONS.payment_method.card.decryption_required:
      type: string
      enum:
        - 'YES'
        - 'NO'
      description: Indicates whether Global Payments must decrypt the merchant’s encrypted data to process the transaction.
      example: 'YES'
    payment_account_reference_mode_VERIFICATIONS.payment_method.card.payment_account_reference_mode:
      type: string
      enum:
        - REQUESTED
        - NOT_REQUESTED
      description: 'Indicates whether Payment Account Reference (PAR) should be returned with the authorization, when available'
      example: REQUESTED
    issuer_VERIFICATIONS.payment_method.card.issuer:
      type: string
      description: The name of the issuing bank that issued the card.
      example: JP MORGAN CHASE BANK
    currency_VERIFICATIONS.payment_method.card.currency:
      type: string
      description: The currency associated with the country of issuing bank.
      minLength: 3
      maxLength: 3
      example: USD
    country_VERIFICATIONS.payment_method.card.country:
      type: string
      description: This is the country the card is issued in. It represents the country the card's bank is based.The country in ISO-3166-1(alpha-2 code) format.
      example: US
    eci_VERIFICATIONS.payment_method.card.eci:
      type: string
      description: This is the cryptogram eci that is needed to process a CIT Network Tokenization request with 3DSecure
      maxLength: 5
      example: '5'
    network_token_expiry_month_VERIFICATIONS.payment_method.card.network_token_expiry_month:
      type: string
      description: The 2 digit expiry date month of the network token.
      example: '12'
    network_token_expiry_year_VERIFICATIONS.payment_method.card.network_token_expiry_year:
      type: string
      description: The 2 digit expiry date year of the network token.
      example: '27'
    track_number_VERIFICATIONS.payment_method.card.track_number:
      type: string
      description: The number that identifies the track data type. This field is required if the track data is encrypted.
      example: '2'
    masked_network_token_last4_VERIFICATIONS.payment_method.card.masked_network_token_last4:
      type: string
      description: Masked network token but last 4 digits of the network token are visible.
      example: XXXXXXXXXXXX1234
    transaction_link_reference_VERIFICATIONS.payment_method.card.transaction_link_reference:
      type: string
      description: A reference that links this verification to a related transaction.
      example: TLK_000012345
    requestor_reference_VERIFICATIONS.payment_method.card.requestor_reference:
      type: string
      description: 'The identifier assigned to the token requestor, which is the entity requesting the token. It is passed to the processor with the request.'
      example: '40010000001'
    payment_account_reference_VERIFICATIONS.payment_method.card.payment_account_reference:
      type: string
      description: This is the Payment Account Reference (PAR) that is returned by the Issuer when requested and available.
      example: PAR_1234567890123456789012345
    account_number_VERIFICATIONS.payment_method.bank_transfer.account_number:
      type: string
      description: The number or reference for the payer's bank account.
      example: '23452423'
    account_type_VERIFICATIONS.payment_method.bank_transfer.account_type:
      type: string
      enum:
        - CHECKING
        - SAVING
      description: The type of bank account associated with the payer's bank account.
      example: CHECKING
    check_reference_VERIFICATIONS.payment_method.bank_transfer.check_reference:
      type: string
      description: The number or reference for the check.
      example: '879987767'
    verification_level_VERIFICATIONS.payment_method.bank_transfer.verification_level:
      type: string
      enum:
        - LEVEL_1
        - LEVEL_2
        - LEVEL_3
      description: Determines the level at which the ACH account is verified by the host system.
      example: LEVEL_1
    code_VERIFICATIONS.payment_method.bank_transfer.bank.code:
      type: string
      description: The local identifier code for the bank.
    name_VERIFICATIONS.payment_method.bank_transfer.bank.name:
      type: string
      description: The name of the bank.
    international_code_MERCHANTS.payment_methods.bank_transfer.bank.international_code:
      $ref: '#/components/schemas/middle_name_result_VERIFICATIONS.account_name_inquiry.middle_name_result'
    middle_name_result_VERIFICATIONS.account_name_inquiry.middle_name_result:
      type: string
      enum:
        - MATCHED
