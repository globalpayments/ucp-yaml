openapi: 3.0.3
info:
  version: 2021 03 22
  title: Verifications
  description: Verifications represent the validation of a payment method to ensure it can be used in the creation of a Transaction.
  contact:
    name: API Integrations
    url: 'https://developer.globalpay.com/?gp-api=true'
    email: api.integrations@globalpay.com
  x-gp-yaml-file-version: 1.2
servers:
  - url: 'https://apis.sandbox.globalpay.com/ucp'
    description: Sandbox Environment
  - url: 'https://apis.globalpay.com/ucp'
    description: Production Environment
paths:
  /verifications:
    post:
      tags:
        - Verify
      summary: Verify
      description: Verify a payment method to ensure it can be used to create a Transaction at a later time.
      operationId: createVerification
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-GP-Idempotency'
        - $ref: '#/components/parameters/X-GP-Version'
        - $ref: '#/components/parameters/Content-type'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_request'
            examples:
              Verify a Card:
                value:
                  account_name: Transaction_Processing
                  channel: CNP
                  currency: USD
                  reference: MY_TRANS_REF_12345
                  country: US
                  payment_method:
                    name: James Mason
                    entry_mode: ECOM
                    card:
                      number: '4263970000005262'
                      expiry_month: '05'
                      expiry_year: '30'
              Perform a Balance Inquiry - Prepaid Card:
                value:
                  account_name: Transaction_Processing
                  type: SALE
                  channel: CP
                  amount: '156'
                  currency: CAD
                  country: CA
                  capture_mode: AUTO
                  reference: testreference
                  payment_method:
                    name: Jane Doe
                    entry_mode: MANUAL
                    card:
                      funding: PREPAID
                      number: '4003000123456781'
                      expiry_month: '12'
                      expiry_year: '30'
              Verify a Card with Encrypted card details:
                value:
                  channel: CNP
                  country: CA
                  currency: CAD
                  reference: myuniquereference
                  account_name: transaction_processing
                  payment_method:
                    first_name: John
                    last_name: Doe
                    entry_mode: ECOM
                    card:
                      number: DGYTNKBU67JHACYA==
                      cvv: '123'
                      expiry_month: '12'
                      expiry_year: '26'
                      cvv_indicator: PRESENT
                      avs_address: string
                      avs_postal_code: string
                      decryption_required: 'YES'
                    encryption:
                      version: '05'
                      method: KSN
                      info: RVNRGvbAEkHI=
                      type: ASCII
              Perform ACH verification to validate bank account details:
                value:
                  merchant_id: MER_7a20bd695b6c4ca8b5cedb8300b40e66
                  account_id: TRA_ae0784fab6f246c0b676f66f7c9c434a
                  channel: CNP
                  currency: USD
                  country: US
                  capture_mode: AUTO
                  reference: TRANS-20180114123459878
                  lane_id: '2272338'
                  payment_method:
                    first_name: Jane
                    last_name: Doe
                    entry_mode: ECOM
                    narrative: '123'
                    bank_transfer:
                      account_number: '123456678'
                      account_type: SAVING
                      bank:
                        code: '083908420'
                        name: First Union
                  payer:
                    name: ANGELA SMITH
                    reference: '123'
                    date_of_birth: '1967-08-13'
                    landline_phone: '235555'
                    mobile_phone: '222222'
                    home_phone:
                      country_code: '44'
                      subscriber_number: '1234512346'
                    work_phone:
                      country_code: '44'
                      subscriber_number: '1234512346'
                    billing_address:
                      line_1: line_1
                      line_2: line_2
                      city: test
                      state: AZ
                      postal_code: '22114'
                      country: USA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create_response'
              examples:
                Perform a Balance Inquiry - Prepaid Card:
                  value:
                    id: VER_NBTL2Kihd8Z878oaF764RQECrizXMK
                    time_created: '2026-03-03T20:22:32.503Z'
                    type: VERIFICATION
                    status: VERIFIED
                    channel: CP
                    country: CA
                    merchant_id: MER_c5d37eaf0e3841e083c232b2318af55c
                    merchant_name: Sandbox_Merchant_4
                    account_id: TRA_27c901760029495f813afbb0dab197ef
                    account_name: transaction_processing
                    reference: '99439631'
                    payment_method:
                      result: '00'
                      message: APPROVAL
                      entry_mode: MANUAL
                      card:
                        funding: PREPAID
                        brand: VISA
                        masked_number_last4: XXXXXXXXXXXX6781
                        authcode: VI0000
                        brand_reference: '006062400006552'
                        available_balance: '-123456789011'
                    batch_id: ''
                    action:
                      id: ACT_NBTL2Kihd8Z878oaF764RQECrizXMK
                      type: VERIFY
                      time_created: '2026-03-03T20:22:32.503Z'
                      result_code: SUCCESS
                      app_id: T6og1tbECpHFeO104qUM383oq5bOJ12r
                      app_name: Postman_Collection_Test
                Perform ACH verification to validate bank account details:
                  value:
                    id: VER_2GjnPZynN2bciMlcApl0GSkme7U5xj
                    time_created: '2026-05-27T10:53:55.134Z'
                    type: VERIFICATION
                    status: VERIFIED
                    channel: CNP
                    country: US
                    merchant_id: MER_7a20bd695b6c4ca8b5cedb8300b40e66
                    merchant_name: internet2
                    account_id: TRA_ae0784fab6f246c0b676f66f7c9c434a
                    account_name: Mindbody_Processing
                    reference: TRANS-20180114123459878
                    payment_method:
                      result: A0000
                      message: Success
                      bank_transfer:
                        account_number: XXXXX6678
                        account_type: SAVING
                        bank:
                          name: First Union
                    action:
                      id: ACT_2GjnPZynN2bciMlcApl0GSkme7U5xj
                      type: VERIFY
                      time_created: '2026-05-27T10:53:55.134Z'
                      result_code: SUCCESS
                      app_id: VuT4qLPs98hwVMnGAPkWz3KDIuAumlwz
                      app_name: ecom_transit_app
        '400':
          $ref: '#/components/responses/RequestInvalid_400'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid_401'
        '403':
          $ref: '#/components/responses/NotAuthorized_403'
        '404':
          description: Resource Not Found
        '500':
          $ref: '#/components/responses/ServerError_500'
        '501':
          $ref: '#/components/responses/UnknownServerError_501'
        '502':
          $ref: '#/components/responses/UnknownPlatformError_502'
        '504':
          $ref: '#/components/responses/ServerTimeout_504'
      security:
        - bearerAuth: []
      servers:
        - url: 'https://apis.sandbox.globalpay.com/ucp'
          description: Sandbox Environment
        - url: 'https://apis.globalpay.com/ucp'
          description: Production Environment
tags:
  - name: Verify
    description: Verify a payment method to ensure it can be used to create a Transaction at a later time.
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: Bearer access token value used to authorize and access the API.  Must always begin with the string "Bearer".
      required: true
      schema:
        type: string
        default: Bearer G3FA4TuYGCBiCWs4YpzrALGCYXZJ  #Hard Coded for Testing. Don’t submit any personally identifiable information (PII) in requests made with this key.
        example: Bearer G3FA4TuYGCBiCWs4YpzrALGCYXZJ
    X-GP-Idempotency:
      name: X-GP-Idempotency
      in: header
      description: Integrator generated value submitted in the request header that is checked to ensure the same value has not been seen in the last 24 hours. It is used to ensure idempotency is maintained with this action.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 50
    X-GP-Version:
      name: X-GP-Version
      in: header
      description: The version of the API to execute the request.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
        default: '2021-03-22'
        example: '2021-03-22'
    Content-type:
      name: Content-type
      in: header
      description: Format of the message body.
      required: true
      schema:
        type: string
        default: application/json
        example: application/json
    Accept:
      name: Accept
      in: header
      description: Indicates the expected format of the message response.
      required: false
      schema:
        type: string
        default: application/json
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    RequestInvalid_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/objRequestInvalid_400'
    AuthenticationInvalid_401:
      description: Not Authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationInvalid_401'
    NotAuthorized_403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAuthorized_403'
    ServerError_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError_500'
    UnknownServerError_501:
      description: Not implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnknownServerError_501'
    UnknownPlatformError_502:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnknownPlatformError_502'
    ServerTimeout_504:
      description: Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerTimeout_504'
