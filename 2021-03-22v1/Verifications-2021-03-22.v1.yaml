    tag_response_VERIFICATIONS.payment_method.digital_wallet.tag_response:
      type: string
      description: The card EMV tag response data from the card issuer for a contactless or chip card transaction.
    funding_VERIFICATIONS.payment_method.digital_wallet.funding:
      type: string
      enum:
