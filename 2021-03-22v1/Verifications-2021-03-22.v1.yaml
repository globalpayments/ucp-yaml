        - PREPAID
      description: 'Indicates how the card is funded * `DEBIT'' - indicates the card is a debit card where the funds may be present in an account to fulfill the transaction amount. * `CREDIT'' - indicates the card is a credit card where the funds may be available on credit to the payer to fulfill the transaction amount.`CASH_BENEFITS'' - indicates the card is an, Electronic Benefits Transfer, for cash benefits. * `FOOD_STAMP'' - indicates the card is an, Electronic Benefits Transfer, for food stamps. * `PREPAID'' - indicates the card is a prepaid card where the funds are loaded to the card account to fulfill the transaction amount. Unlike a debit card, a prepaid is not linked to a bank account.'
      example: CREDIT
    avs_postal_code_result_VERIFICATIONS.payment_method.digital_wallet.avs_postal_code_result:
      type: string
      enum:
        - MATCHED
        - NOT_MATCHED
        - NOT_CHECKED
      description: The result of the AVS postal code check.
