    type_VERIFICATIONS.device.type:
      type: string
      enum:
        - MOBILE_POS
        - MOBILE_POS_PLUS_HARDWARE
        - MOBILE_POS_PLUS_DONGLE
        - DONGLE_PIN
        - MOBILE_POS_PIN
        - OFF_THE_SHELF
      description: |
        "Indicates the type of physical device used to process the transaction.
        * `MOBILE_POS` - Mobile device with no add-on hardware.
        * `MOBILE_POS_PLUS_HARDWARE` - Mobile device with add-on hardware.
        * `MOBILE_POS_PLUS_DONGLE` - Dedicated mPOS Terminal with PCI compliant dongle.
        * `DONGLE_PIN` - Dongle with software-based application that supports PIN entry on glass.
        * `MOBILE_POS_PIN` - Off the shelf mobile device with software-based application that supports PIN entry on glass.
        * 'OFF_THE_SHELF' - Off the shelf mobile device"
      example: MOBILE_POS
    reference_VERIFICATIONS.device.reference:
      type: string
      description: The integrator submitted reference or identifier for the device.
      example: DEVICE-001
    lane_reference_VERIFICATIONS.device.lane_reference:
      type: string
      description: A unique value that identifies the lane of the transaction origin point.
      maxLength: 8
      example: '5'
    payer_verifications_VERIFICATIONS.device.payer_verifications:
      type: string
      enum:
        - NOT_VERIFIED
        - PINPAD
        - ELECTRONIC_SIGNATURE_ANALYSIS
        - MANUAL_SIGNATURE_ANALYSIS
        - MANUAL_OTHER
        - UNKNOWN
        - SYSTEMATIC_OTHER
        - OFFLINE_PIN
      description: Indicates the method used to verify the payer.
      example: PINPAD
    session_reference_VERIFICATIONS.device.session_reference:
      type: string
      description: A unique identifier generated by the provider for initiationg device profiling.
      maxLength: 255
      example: SESSION-ABC-123
    entry_modes_VERIFICATIONS.device.capabilities.entry_modes:
      type: array
      description: Describes the entry mode capabilities a device has.
      items:
        type: string
        enum:
          - CHIP
          - CONTACTLESS
          - MANUAL
          - SWIPE
          - CONTACTLESS_SWIPE
          - OPTICAL_CHARACTER_READER
          - UNKNOWN
      example:
        - CHIP
    payer_verifications_VERIFICATIONS.device.capabilities.payer_verifications:
      type: array
      description: Describes the capabilities a device has to verify a payer.
      items:
        type: string
        enum:
          - NONE
          - PINPAD
          - SIGNATURE_ANALYSIS
          - NO_SINGATURE_ANALYSIS
          - PAYER_DEVICE
          - CONTACTLESS_SIGNATURE
          - OTHER
          - UNKNOWN
      example:
        - PINPAD
    mobile_VERIFICATIONS.device.capabilities.mobile:
      type: array
      description: Describes the mobile features a device has.
      items:
        type: string
        enum:
          - INTEGRATED_CARD_READER
          - SEPARATE_CARD_READER
          - OFF_THE_SHELF
          - SOFTWARE_BASED_PIN_ENTRY
      example:
        - INTEGRATED_CARD_READER
    enabled_response_VERIFICATIONS.device.capabilities.enabled_response:
      type: array
      description: Describes the data the device can process when it receives a response for a card authorization.
      items:
        type: string
        enum:
          - AVS
          - CVV
          - BRAND_REFERENCE
          - MASKED_NUMBER_LAST4
      example:
        - AVS
    authorization_modes_VERIFICATIONS.device.capabilities.authorization_modes:
      type: array
      description: Describes whether the device can process partial authorizations.
      items:
        type: string
        enum:
          - PARTIAL
          - ALTERNATIVE
      example:
        - PARTIAL
    attendance_modes_VERIFICATIONS.device.capabilities.attendance_modes:
      type: array
      description: Indicates whether the device is attended or not.
      items:
        type: string
        enum:
          - ATTENDED
          - UNATTENDED
      example:
        - ATTENDED
    fraud_VERIFICATIONS.device.capabilities.fraud:
      type: array
      description: Describes the instruction a device can indicate to the clerk in the case of fraud.
      items:
        type: string
        enum:
          - PICK_UP_CARD
      example:
        - PICK_UP_CARD
    display_line_count_VERIFICATIONS.device.capabilities.display_line_count:
      type: number
      description: The number of lines that can be used to display information on the device.
      minimum: 1
      maximum: 50
    location_VERIFICATIONS.device.capabilities.location:
      type: array
      description: |
        Describes the location where the device is being used.
        * `ON_MERCHANT_PREMISIS` - The transaction took place on the merchant's premesis. This value should be used for EMV contact transactions and must be provided in conjuction with an attendance_mode.
        * `OFF_MERCHANT_PREMISIS` - The transaction took place away from the merchant's premesis. This value should be used for EMV contact transactions and must be provided in conjuction with an attendance_mode.
        * `ON_PAYER_PREMISIS` - The transaction took place on the payer's premesis. This value can be used for EMV contact or EMV contactless transactions and must be provided in conjuction with an attendance_mode.
        * `OFF_PAYER_PREMISIS` - The transaction took place away from the payer's premesis. This value can be used for EMV contact or EMV contactless transactions and must be provided in conjuction with an attendance_mode.
        * `ON_MERCHANT_PREMISES_MPOS` - The transaction took place on the merchant's premesis, using the merchant's mobile POS solution. Attendance_mode should not be sent when providing this location.
        * `OFF_MERCHANT_PREMISES_MPOS` - The transaction took place away from the merchant's premesis, and used the merchant's mobile POS solution. Attendance_mode should not be sent when providing this location.
        * `ON_MERCHANT_PREMISES_PAYER_POS` - The transaction took place away from the merchant's premesis, and used the merchant's mobile POS solution. Attendance_mode should not be sent when providing this location.
        * `OFF_MERCHANT_PREMISES_PAYER_POS` - The transaction took place away from the merchant's premesis, and used the merchant's mobile POS solution. Attendance_mode should not be sent when providing this location.
        * `UNKNOWN` - The transaction took place at an unknown location.
      items:
        type: string
        enum:
          - ON_MERCHANT_PREMISES
          - OFF_MERCHANT_PREMISES
          - UNKNOWN
          - ON_PAYER_PREMISES
          - OFF_PAYER_PREMISES
          - OFF_MERCHANT_PREMISES_MPOS
          - ON_MERCHANT_PREMISES_MPOS
          - OFF_MERCHANT_PREMISES_PAYER_POS
      example:
        - ON_MERCHANT_PREMISIS
    output_VERIFICATIONS.device.capabilities.output:
      type: string
      enum:
        - NONE
        - PRINT
        - DISPLAY
        - PRINT_AND_DISPLAY
        - UNKNOWN
      description: |
        Indicates the output capabilities of the device.
        * `NONE` - The device has no output capability.
        * `PRINT` - The device has the ability to print.
        * `DISPLAY` - The device has display capability.
        * `PRINT_AND_DISPLAY` - The device has print and display capability.
        * `UNKNOWN` - The device's output capability is unknown.
      minLength: 1
      maxLength: 50
      example: PRINT
    card_capture_VERIFICATIONS.device.capabilities.card_capture:
      type: string
      enum:
        - 'YES'
        - 'NO'
      description: Indicates if the device is capable of pulling the card into the device while the transaction is taking place
      minLength: 1
      maxLength: 50
      example: 'NO'
    max_pin_count_VERIFICATIONS.device.capabilities.max_pin_count:
      type: string
      enum:
        - UNKNOWN
        - NOT_SUPPORTED
        - '4'
        - '5'
        - '6'
        - '7'
        - '8'
        - '9'
        - '10'
        - '11'
        - '12'
      description: Indicates the maximum accepted length for PIN number.
      minLength: 1
      maxLength: 50
      example: NOT_SUPPORTED
    card_update_VERIFICATIONS.device.capabilities.card_update:
      type: string
      enum:
        - 'YES'
        - 'NO'
      description: This field indicates the ability of the device and software to update or change the card information
      minLength: 1
      maxLength: 50
      example: 'NO'
    initiator_VERIFICATIONS.initiator:
      type: string
      enum:
        - PAYER
        - MERCHANT
      description: |
        Indicates whether the Merchant or the Payer initiated the creation of a transaction.
        * `PAYER` - The transaction was initiated by the customer who is paying the merchant.
        * `MERCHANT` - The transaction was initiated by the merchant, who is getting paid by the payer.
      minLength: 1
      maxLength: 50
      example: PAYER
    line_1_VERIFICATIONS.additional_merchant_details.address.line_1:
      type: string
      description: 'Merchant''s street address, including street number, street name, and location identifiers (e.g., building or unit number).'
      minLength: 1
      maxLength: 25
      example: '123 Rose St, ABC Towers'
    business_phone_VERIFICATIONS.additional_merchant_details.business_phone:
      type: string
      description: The phone number of the Merchant.
      minLength: 1
      maxLength: 16
      example: '9876548710'
    inquiry_phone_VERIFICATIONS.additional_merchant_details.inquiry_phone:
      type: string
      description: The customer care number of the Merchant.
      minLength: 1
      maxLength: 16
      example: '1800888888'
    url_VERIFICATIONS.additional_merchant_details.url:
      type: string
      description: The url address of the Merchant.
      minLength: 1
      maxLength: 30
      example: www.xyz.com
    first_name_result_VERIFICATIONS.account_name_inquiry.first_name_result:
      type: string
      enum:
        - MATCHED
        - PARTIAL_MATCH
        - NOT_MATCHED
      description: The result of comparing the first name provided in the request with the first name on file for the account.
      example: MATCHED
    last_name_result_VERIFICATIONS.account_name_inquiry.last_name_result:
      type: string
      enum:
        - MATCHED
        - PARTIAL_MATCH
        - NOT_MATCHED
      description: The result of comparing the last name provided in the request with the middle name on file for the account.
      example: MATCHED
    full_name_result_VERIFICATIONS.account_name_inquiry.full_name_result:
      type: string
      enum:
        - MATCHED
        - PARTIAL_MATCH
        - NOT_MATCHED
      description: The result of comparing the full name provided in the request with the name on file for the account.
      example: MATCHED
    result_VERIFICATIONS.account_name_inquiry.result:
      type: string
      enum:
        - MATCHED
        - PARTIAL_MATCH
        - NOT_MATCHED
        - NOT_CHECKED
        - NOT_SUPPORTED
        - SUCCESSFUL
        - FAILED
        - UNKNOWN
      description: The overall outcome of the account name inquiry.
      example: MATCHED
